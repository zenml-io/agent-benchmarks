[project]
name = "swapbench"
version = "0.1.0"
description = "SwapBench: is it safe to swap the model behind a production agent, and which checks can tell?"
requires-python = ">=3.12,<3.13"
# Versions match the environment every published run used (Python 3.12.3, Oct 13-16 2026).
dependencies = [
    "tau2",
    "litellm==1.82.6",
    "openai==3.29.0",
    "pydantic==2.14.1",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "pyyaml==6.0.3",
    "websockets==17.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# The code is run as scripts from this directory (scripts/ put the benchmark dir on sys.path), not installed.
package = false
# Transitive versions pinned to the original run environment too.
constraint-dependencies = [
    "certifi==2026.7.22", "fastapi==0.143.0", "starlette==1.8.0", "filelock==4.1.1", "httpcore2==2.13.1",
    "httpx2==2.13.1", "python-dateutil==2.9.0.post0", "zipp==4.1.1",
]

[tool.uv.sources]
# tau2-bench at commit dd8757d4c8791dad7b3cdaf02a105a3d5f9d86bd, fetched by scripts/fetch_tau2.sh.
tau2 = { path = "third_party/tau2-bench", editable = true }

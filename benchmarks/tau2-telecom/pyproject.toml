[project]
name = "tau2-telecom-benchmark"
version = "0.1.0"
description = "tau2-bench Telecom: public Exgentic traces with a Kitaru step check, and live Kitaru replays of a PydanticAI agent"
requires-python = ">=3.12,<3.13"
# Base install: what the free checks need (fetch the public traces, rebuild both result files).
dependencies = [
    "pyarrow==22.0.0",
]

[project.optional-dependencies]
# Live agent, Kitaru worker and evaluator (harness/replay). Paid when run.
replay = [
    "tau2",
    "kitaru[cli,worker]",
    "kitaru-pydantic-ai[openai]",
]
# Kitaru model-swap step check (harness/step_check). Paid when run.
step-check = [
    "kitaru[cli]",
    "kitaru-model-swap",
]

[tool.uv]
package = false
# Every third-party package version the original replay environment resolved to
# (its uv.lock), so a fresh lock picks the same versions.
constraint-dependencies = [
    "addict==2.4.0",
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.5",

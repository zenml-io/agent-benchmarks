[tool.uv.sources]
# tau2-bench at the commit the replay ran on (2026-10-21; package version 2.0.0).
tau2 = { git = "https://github.com/sierra-research/tau2-bench", rev = "05736c27219b769d0be507574dd3135010916644" }
# Kitaru branch feature/model-swap-analyzer at the commit the step check and replays ran on
# (kitaru 0.27.2+dev, kitaru-pydantic-ai 0.3.1, kitaru-model-swap 0.1.0; unreleased at the time).
kitaru = { git = "https://github.com/zenml-io/kitaru", rev = "0217140c9bd6fc1b0569abefbaea30be20a6fde4" }
kitaru-pydantic-ai = { git = "https://github.com/zenml-io/kitaru", rev = "0217140c9bd6fc1b0569abefbaea30be20a6fde4", subdirectory = "plugins/packages/pydantic-ai" }
kitaru-model-swap = { git = "https://github.com/zenml-io/kitaru", rev = "0217140c9bd6fc1b0569abefbaea30be20a6fde4", subdirectory = "plugins/packages/model-swap" }

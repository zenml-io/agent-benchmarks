services:
  main:
    depends_on:
      uw-runtime:
        condition: service_healthy
  uw-runtime:
    build:
      context: ./runtime
    environment:
      - EVAL_ANTHROPIC_API_KEY=${EVAL_ANTHROPIC_API_KEY:-}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

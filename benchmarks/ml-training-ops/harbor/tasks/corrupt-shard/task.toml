schema_version = "1.4"

# The verifier container gets the agent's /app back (and nothing else of the agent's container).
artifacts = ["/app"]

[task]
name = "zenml/mlops-corrupt-shard"
version = "2.0.0"
description = "Loss became NaN: find the bad data before the restart"
keywords = ["ml-training", "operations", "pytorch"]

[metadata]
round = "hard"
difficulty = "hard"
category = "ml-training-ops"
tags = ["ml-training", "pytorch", "operations"]
grader_changed_from_original = false
needs_gpu = false

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 10240

schema_version = "1.4"

# The verifier container gets the agent's /app back (and nothing else of the agent's container).
artifacts = ["/app"]

[task]
name = "zenml/mlops-nan-loss"
version = "2.0.0"
description = "The training job's loss turns NaN after a few steps"
keywords = ["ml-training", "operations", "pytorch"]

[metadata]
round = "v1"
difficulty = "medium"
category = "ml-training-ops"
tags = ["ml-training", "pytorch", "debugging"]
grader_changed_from_original = true
needs_gpu = false

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[agent]
timeout_sec = 1200.0

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
